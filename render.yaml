# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push to GitHub, then open
#   https://render.com/deploy?repo=https://github.com/Varshith-7766/smart-inventory
services:
  - type: web
    name: smart-inventory
    runtime: docker
    repo: https://github.com/Varshith-7766/smart-inventory
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Session signing key — auto-generated by Render on first deploy.
      - key: SECRET_KEY
        generateValue: true
      # Render serves HTTPS; keep cookies secure-only.
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # REQUIRED: set this in the Render dashboard to your database's
      # connection string (e.g. the Internal Database URL of a Render
      # PostgreSQL instance). Tables are created automatically on boot.
      - key: DATABASE_URL
        sync: false
      # Optional: API key of a registered IoT device (simulator only).
      - key: IOT_API_KEY
        sync: false
      - key: PREDICTION_INTERVAL_DAYS
        value: "7"
      - key: LOW_STOCK_THRESHOLD
        value: "10"