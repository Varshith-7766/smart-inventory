<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Smart Inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="logo">
            <div class="logo-icon">SI</div>
            <h1>Smart Inventory</h1>
            <p>Sign in to your account</p>
        </div>

        <div class="login-error" id="loginError"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-full" id="loginBtn">
                Sign In
            </button>
        </form>

        <p style="text-align:center; margin-top: 1.5rem; font-size:0.8rem; color:var(--text-muted);">
            Demo: admin / admin123
        </p>
        <p style="text-align:center; margin-top: 0.75rem; font-size:0.85rem;">
            No account?
            <a href="register.html" style="color:var(--primary); font-weight:600;">Sign up</a>
        </p>
    </div>

    <script src="../static/js/app.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById("loginBtn");
            const err = document.getElementById("loginError");

            btn.disabled = true;
            btn.textContent = "Signing in...";
            err.style.display = "none";

            try {
                await api.post("/auth/login", {
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value,
                });
                await refreshCSRFToken();
                window.location.href = "dashboard.html";
            } catch (error) {
                err.textContent = error.message;
                err.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.textContent = "Sign In";
            }
        }
    </script>
</body>
</html>
