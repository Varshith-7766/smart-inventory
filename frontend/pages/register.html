<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Smart Inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="logo">
            <div class="logo-icon">SI</div>
            <h1>Smart Inventory</h1>
            <p>Create a new account</p>
        </div>

        <div class="login-error" id="registerError"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Choose a username" required autofocus>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Create a password" required minlength="4">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-full" id="registerBtn">
                Create Account
            </button>
        </form>

        <p style="text-align:center; margin-top: 1.5rem; font-size:0.85rem;">
            Already have an account?
            <a href="login.html" style="color:var(--primary); font-weight:600;">Sign in</a>
        </p>
    </div>

    <script src="../static/js/app.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById("registerBtn");
            const err = document.getElementById("registerError");

            const password = document.getElementById("password").value;
            const confirm = document.getElementById("confirmPassword").value;

            if (password !== confirm) {
                err.textContent = "Passwords do not match";
                err.style.display = "block";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Creating account...";
            err.style.display = "none";

            try {
                await api.post("/auth/register", {
                    username: document.getElementById("username").value,
                    email: document.getElementById("email").value,
                    password: password,
                    role: "admin",
                });
                await refreshCSRFToken();
                window.location.href = "dashboard.html";
            } catch (error) {
                err.textContent = error.message;
                err.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.textContent = "Create Account";
            }
        }
    </script>
</body>
</html>
