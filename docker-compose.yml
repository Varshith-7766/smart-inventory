version: "3.8"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Override in production:  MYSQL_ROOT_PASSWORD=<strong-password>
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: smart_inventory
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  web:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://root:rootpassword@db:3306/smart_inventory}
      # If SECRET_KEY is not set, the app generates a random one at startup
      # (sessions reset on restart). Set a strong value for persistent sessions.
      SECRET_KEY: ${SECRET_KEY:-}
    depends_on:
      - db

volumes:
  mysql_data: